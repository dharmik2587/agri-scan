name: Deploy to Hugging Face Space

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Push repo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          repo_id = os.environ['HF_SPACE_REPO']

          if not token or not repo_id:
              raise SystemExit('HF_TOKEN and HF_SPACE_REPO must be set as GitHub secrets.')

          api = HfApi(token=token)
          api.upload_folder(
              repo_id=repo_id,
              repo_type='space',
              folder_path='.',
              commit_message='Deploy AgriScan from GitHub',
          )
          print(f'Pushed repository contents to Hugging Face Space: {repo_id}')
          PY
